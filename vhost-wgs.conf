# VirtualHost snippet for XAMPP Apache
# Save this into C:\xampp\apache\conf\extra\httpd-vhosts.conf (or include it), then restart Apache.

<VirtualHost *:80>
    ServerName wgs
    DocumentRoot "C:/WebDev/WhatsGodSay/WhatsGodSay"
    <Directory "C:/WebDev/WhatsGodSay/WhatsGodSay">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/wgs-error.log"
    CustomLog "logs/wgs-access.log" common
</VirtualHost>

# Hosts file entry (only if not already present):
# 127.0.0.1 wgs

# After adding, restart Apache in XAMPP Control Panel and open:
# http://wgs/ or http://wgs/index.html
